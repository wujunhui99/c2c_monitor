<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>C2C Arbitrage Monitor</title>
    <link rel="stylesheet" href="/css/style.css">
    <script
        src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"
        integrity="sha384-BQKzmHvQLMCAnL3UtDBA1Al5tFjsCz1wrMlIUA1wkzo14DYkRWjywW+p9pCj0cwd"
        crossorigin="anonymous"
    ></script>
</head>
<body>

<div class="container">
    <header>
        <div class="header-main">
            <div class="header-title-group">
                <h1>C2C Price Monitor</h1>
                <a href="/release-notes.html" target="_blank" rel="noreferrer" class="version-link">
                    <span id="app-version-badge" class="version-badge">Loading version...</span>
                </a>
            </div>
            <div id="system-status-indicator" class="status-indicator loading">
                <span class="status-dot"></span>
                <span class="status-text">Checking System Status...</span>
                <div class="status-details-tooltip">
                    <!-- Populated by JS -->
                </div>
            </div>
        </div>
        <div class="tabs">
            <button class="tab-btn active" data-tab="dashboard">Dashboard</button>
            <button class="tab-btn" data-tab="settings">Settings</button>
        </div>
    </header>

    <!-- Dashboard Tab -->
    <div id="dashboard" class="tab-content active">
        <div class="control-bar">
            <div class="control-group">
                <label for="amount-select">Amount Tier:</label>
                <select id="amount-select">
                    <!-- Populated by JS -->
                </select>
            </div>
            
            <div class="control-group">
                <div class="btn-group">
                    <button class="range-btn active" data-range="1d">24H</button>
                    <button class="range-btn" data-range="7d">7D</button>
                    <button class="range-btn" data-range="30d">30D</button>
                    <button class="range-btn" data-range="all">All</button>
                </div>
            </div>

            <div class="benchmark-summary" aria-live="polite">
                <span>Alert Benchmark</span>
                <strong id="dashboard-benchmark">--</strong>
            </div>
            
            <button id="refresh-btn">Refresh</button>
        </div>

        <div id="main-chart" class="chart-container"></div>
        
        <!-- Active Alerts Section -->
        <div class="alert-status-section">
            <h3>Market Alert Lows</h3>
            <div class="alert-table-wrap">
                <table id="alert-status-table">
                    <colgroup>
                        <col class="market-column">
                        <col class="price-column">
                        <col class="action-column">
                    </colgroup>
                    <thead>
                        <tr>
                            <th>Market (Exchange-Side-Amount)</th>
                            <th>Last Alert Price (CNY)</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Settings Tab -->
    <div id="settings" class="tab-content">
        <div class="settings-panel">
            <h3>Polling Intervals</h3>
            <div class="form-group">
                <label for="c2c-interval">C2C Poll Interval (minutes)</label>
                <input type="number" id="c2c-interval" min="1">
            </div>
            <div class="form-group">
                <label for="forex-interval">Forex Poll Interval (hours)</label>
                <input type="number" id="forex-interval" min="1">
            </div>
            <div class="form-group">
                <label for="forex-max-age">Forex Maximum Age (hours)</label>
                <input type="number" id="forex-max-age" min="1">
            </div>

            <h3>Administrator</h3>
            <div class="form-group">
                <label for="admin-token">Admin Token</label>
                <input type="password" id="admin-token" autocomplete="off" spellcheck="false">
            </div>

            <h3>Alert Benchmark</h3>
            <dl class="benchmark-readout">
                <div>
                    <dt>Current Forex</dt>
                    <dd id="current-forex-rate">--</dd>
                </div>
                <div>
                    <dt>Current Benchmark</dt>
                    <dd id="current-alert-benchmark">--</dd>
                </div>
            </dl>
            <div class="form-group">
                <label for="alert-benchmark-input">New Lower Benchmark (CNY)</label>
                <input type="number" id="alert-benchmark-input" min="0.0001" step="0.0001" inputmode="decimal">
                <div id="alert-benchmark-limit" class="field-note"></div>
            </div>
            <div class="inline-action-row">
                <button id="save-benchmark-btn" class="primary-btn">Save Benchmark</button>
                <span id="benchmark-save-status" class="status-msg" aria-live="polite"></span>
            </div>

            <h3>Target Amounts (CNY)</h3>
            <div class="form-group">
                <div id="amount-tags" class="tags-container">
                    <!-- Populated by JS -->
                </div>
                <div class="add-amount-group">
                    <input type="number" id="new-amount" min="0" step="any" placeholder="Enter amount (e.g., 500)">
                    <button id="add-amount-btn" class="primary-btn" style="padding: 8px 15px;">Add</button>
                </div>
            </div>

            <div style="margin-top: 30px;">
                <button id="save-config-btn" class="primary-btn">Save Configuration</button>
                <span id="save-status" class="status-msg"></span>
            </div>
        </div>
    </div>
</div>

<script src="/js/config.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
