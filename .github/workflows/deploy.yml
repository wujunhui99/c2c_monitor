name: Deploy To K3s

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: Published full 40-character commit SHA image tag to deploy
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://c2c.agenticim.xyz/
    steps:
      - name: Validate image tag
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          if ! [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]]; then
            echo "image_tag must be a full lowercase 40-character commit SHA" >&2
            exit 1
          fi

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.image_tag }}

      - name: Upload Kubernetes assets
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ vars.DEPLOY_PORT != '' && vars.DEPLOY_PORT || '22' }}
          source: "deploy/k8s,scripts/deploy-k3s.sh"
          target: "/tmp/c2c-monitor-deploy"

      - name: Deploy to K3s
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        env:
          GHCR_USERNAME: ${{ vars.GHCR_USERNAME }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          IMAGE_TAG: ${{ inputs.image_tag }}
          SMTP_HOST: ${{ secrets.C2C_SMTP_HOST }}
          SMTP_PORT: ${{ secrets.C2C_SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.C2C_SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.C2C_SMTP_PASSWORD }}
          SMTP_FROM: ${{ secrets.C2C_SMTP_FROM }}
          SMTP_TO: ${{ vars.C2C_SMTP_TO }}
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ vars.DEPLOY_PORT != '' && vars.DEPLOY_PORT || '22' }}
          script_stop: true
          envs: GHCR_USERNAME,GHCR_TOKEN,IMAGE_TAG,SMTP_HOST,SMTP_PORT,SMTP_USERNAME,SMTP_PASSWORD,SMTP_FROM,SMTP_TO
          command_timeout: 20m
          script: |
            set -euo pipefail

            TMP_DIR="/tmp/c2c-monitor-deploy"
            INSTALL_DIR="/opt/c2c-monitor/repo"

            install -d -m 0755 "$INSTALL_DIR/deploy" "$INSTALL_DIR/scripts"
            rm -rf "$INSTALL_DIR/deploy/k8s"
            cp -R "$TMP_DIR/deploy/k8s" "$INSTALL_DIR/deploy/k8s"
            cp "$TMP_DIR/scripts/deploy-k3s.sh" "$INSTALL_DIR/scripts/deploy-k3s.sh"
            chmod 0755 "$INSTALL_DIR/scripts/deploy-k3s.sh"
            rm -rf "$TMP_DIR"

            cd "$INSTALL_DIR"
            KUBECTL=kubectl \
              K8S_DIR="$INSTALL_DIR/deploy/k8s" \
              SECRETS_FILE="/opt/c2c-monitor/secrets.env" \
              DOMAIN="c2c.agenticim.xyz" \
              bash "$INSTALL_DIR/scripts/deploy-k3s.sh"
