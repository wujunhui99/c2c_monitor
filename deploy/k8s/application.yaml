apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: c2c-monitor
  labels:
    app.kubernetes.io/name: c2c-monitor
    app.kubernetes.io/component: backend
spec:
  selector:
    app.kubernetes.io/name: c2c-monitor
    app.kubernetes.io/component: backend
  ports:
    - name: http
      port: 8001
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: c2c-monitor
  labels:
    app.kubernetes.io/name: c2c-monitor
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: c2c-monitor
      app.kubernetes.io/component: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: c2c-monitor
        app.kubernetes.io/component: backend
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      securityContext:
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
      initContainers:
        - name: wait-for-mysql
          image: busybox:1.37
          command:
            - sh
            - -ec
            - until nc -z mysql 3306; do sleep 2; done
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
      containers:
        - name: backend
          image: ghcr.io/wujunhui99/c2c-monitor-backend:__IMAGE_TAG_REQUIRED__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8001
          env:
            - name: GIN_MODE
              value: release
            - name: C2C_APP_ADMIN_TOKEN
              valueFrom:
                secretKeyRef:
                  name: c2c-monitor-runtime
                  key: C2C_APP_ADMIN_TOKEN
            - name: C2C_DATABASE_DSN
              valueFrom:
                secretKeyRef:
                  name: c2c-monitor-runtime
                  key: C2C_DATABASE_DSN
            - name: C2C_NOTIFICATION_EMAIL_SMTP_HOST
              valueFrom:
                secretKeyRef:
                  name: c2c-monitor-runtime
                  key: SMTP_HOST
            - name: C2C_NOTIFICATION_EMAIL_SMTP_PORT
              valueFrom:
                secretKeyRef:
                  name: c2c-monitor-runtime
                  key: SMTP_PORT
            - name: C2C_NOTIFICATION_EMAIL_USERNAME
              valueFrom:
                secretKeyRef:
                  name: c2c-monitor-runtime
                  key: SMTP_USERNAME
            - name: C2C_NOTIFICATION_EMAIL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: c2c-monitor-runtime
                  key: SMTP_PASSWORD
            - name: C2C_NOTIFICATION_EMAIL_FROM
              valueFrom:
                secretKeyRef:
                  name: c2c-monitor-runtime
                  key: SMTP_FROM
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 60
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 384Mi
          volumeMounts:
            - name: config
              mountPath: /app/config/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: logs
              mountPath: /app/logs
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 100
            runAsGroup: 101
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: config
          secret:
            secretName: c2c-monitor-config
        - name: logs
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: c2c-monitor
  labels:
    app.kubernetes.io/name: c2c-monitor
    app.kubernetes.io/component: frontend
spec:
  selector:
    app.kubernetes.io/name: c2c-monitor
    app.kubernetes.io/component: frontend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: c2c-monitor
  labels:
    app.kubernetes.io/name: c2c-monitor
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: c2c-monitor
      app.kubernetes.io/component: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: c2c-monitor
        app.kubernetes.io/component: frontend
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: frontend
          image: ghcr.io/wujunhui99/c2c-monitor-frontend:__IMAGE_TAG_REQUIRED__
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          livenessProbe:
            httpGet:
              path: /nginx-healthz
              port: http
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /nginx-healthz
              port: http
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 128Mi
          volumeMounts:
            - name: frontend-runtime
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
              readOnly: true
            - name: frontend-runtime
              mountPath: /usr/share/nginx/html/js/config.js
              subPath: config.js
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: frontend-runtime
          configMap:
            name: c2c-monitor-frontend-runtime
